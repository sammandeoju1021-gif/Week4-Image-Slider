
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive image slider built with vanilla JavaScript.">
  <title>Image Slider Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="slider.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">CSE 230 · WEEK 4 PROJECT</p>
      <h1>Image Slider Library</h1>
      <p>A responsive slider built with HTML, CSS, and JavaScript.</p>
    </header>

    <section class="slider" aria-label="Image gallery">
      <div class="slider-viewport">
        <div class="slider-track">
          <div class="slide">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=85"
                 alt="Mountain landscape under a beautiful sky">
          </div>
          <div class="slide">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=85"
                 alt="Lake surrounded by mountains">
          </div>
          <div class="slide">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1400&q=85"
                 alt="Sunlight passing through a green forest">
          </div>
          <div class="slide">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1400&q=85"
                 alt="Snow-covered mountain peaks">
          </div>
        </div>

        <button class="slider-arrow previous"
                type="button" aria-label="Previous slide">
          &#10094;
        </button>
        <button class="slider-arrow next"
                type="button" aria-label="Next slide">
          &#10095;
        </button>
      </div>

      <div class="slider-footer">
        <div class="slider-dots" aria-label="Choose a slide"></div>
        <p class="slide-counter" aria-live="polite">1 / 4</p>
      </div>
    </section>

    <footer class="page-footer">
      Built with vanilla JavaScript — no carousel libraries.
    </footer>
  </main>
</body>
</html>
